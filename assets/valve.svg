<svg xmlns="http://www.w3.org/2000/svg" width="80" height="16" viewBox="0 0 80 16">
  <!-- One-way flap-valve plate for the launch channel mouth. Drawn with its
       pivot end at the left and the plate extending along +x, so the game
       pins it at the wall-top pivot and scales its length to the physics
       plate. The game engine draws the hinge pin itself over the pivot at the
       left end. -->
  <!-- Steel plate body with rounded ends. -->
  <rect x="4" y="1" width="72" height="14" rx="5.5" ry="5.5"
        fill="#5a6780" stroke="#3a4357" stroke-width="1"/>
  <!-- Top highlight / bottom shadow make the thickness and the tilt readable. -->
  <rect x="12" y="2.6" width="58" height="2.6" rx="1.3" ry="1.3"
        fill="#c3cdea" opacity="0.9"/>
  <rect x="12" y="11.4" width="58" height="2.2" rx="1.1" ry="1.1"
        fill="#262d3b" opacity="0.85"/>
  <!-- Rivets along the plate spine. -->
  <circle cx="26" cy="8" r="1.5" fill="#333b4c"/>
  <circle cx="42" cy="8" r="1.5" fill="#333b4c"/>
  <circle cx="58" cy="8" r="1.5" fill="#333b4c"/>
  <circle cx="71" cy="8" r="1.3" fill="#333b4c"/>
</svg>
